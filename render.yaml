# Render Blueprint для rieltor-cleaner-almaty (второй город; астанинский
# сервис — отдельный деплой из своего репозитория, они не связаны).
# Деплой: dashboard -> New -> Blueprint -> указать репозиторий с этим файлом.
#
# ПОЧЕМУ WEB SERVICE, А НЕ CRON JOB.
# Cron job на Render не умеет двух обязательных здесь вещей:
#   1. Нет постоянного диска ("cron jobs can't provision or access a
#      persistent disk"). cleaner.db стирался бы между запусками, а вместе
#      с ним content_hash (каждый запуск заново оплачивал бы ВСЮ базу) и
#      таблица batches — то есть отправленные и уже оплаченные batch-задания
#      никто бы никогда не забрал.
#   2. Нет HTTP-эндпоинта — сервис-потребитель не смог бы забрать
#      чистый baseline.
# Поэтому расписание живёт внутри процесса (см. service.py), а платформе
# отдан обычный web service с диском.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ СЕРВИС, А НЕ ЧАСТЬ КОЛЛЕКТОРА.
# Разные профили отказа: у коллектора внешняя зависимость — krisha.kz, у
# этого — OpenAI. Перебой с квотой OpenAI не должен останавливать сбор
# данных и отдачу baseline у коллектора.

services:
  - type: web
    runtime: docker
    name: rieltor-cleaner-almaty
    region: singapore         # тот же регион, что у коллектора — меньше задержка между ними
    plan: starter              # минимальный тариф, на котором вообще доступен диск
    numInstances: 1            # с диском горизонтальное масштабирование и так запрещено

    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    disk:
      name: rieltor-cleaner-almaty-data
      mountPath: /app/data
      sizeGB: 1               # минимум; вердикты + чистый снимок на ~13 тыс. строк ≈ 40 МБ
    envVars:
      - key: DATA_DIR
        value: /app/data

      # Куда ходить за baseline. Если оба сервиса в одном workspace,
      # сюда лучше вписать внутренний адрес коллектора — трафик не пойдёт
      # через интернет. Задать вручную после первого деплоя.
      - key: COLLECTOR_URL
        sync: false
      - key: COLLECTOR_API_KEY
        sync: false           # значение BASELINE_API_KEY коллектора

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini

      # Отдельный ключ только для ручного фото-backfill. Значение хранится
      # в Render Secret Environment, в GitHub не попадает.
      - key: RENOVATION_OPENAI_API_KEY
        sync: false

      # БОЕВОЙ РЕЖИМ: без потолка на число объявлений.
      # 0 = без лимита. Первый же цикл после деплоя разметит всю базу
      # целиком (см. MAX_BATCHES_PER_CYCLE в pipeline.py).
      - key: PILOT_LIMIT
        value: "0"

      # Цикл раз в 12 часов. Первый — сразу при старте, не через 12ч.
      - key: CLEANER_CYCLE_INTERVAL_H
        value: "12"

      # Первый деплой для ручного фото-backfill: API и Shell доступны,
      # автоматический цикл Cleaner не стартует. После второго фото-прохода
      # вручную сменить на "0" и перезапустить сервис.
      - key: CLEANER_API_ONLY
        value: "1"

      # Токен для всех эндпоинтов. Render сгенерирует значение сам —
      # его надо будет скопировать в сервис-потребитель.
      - key: CLEANER_API_KEY
        generateValue: true

      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "8002"
